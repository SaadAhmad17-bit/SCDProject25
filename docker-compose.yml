version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: nodevault-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nodevault-network

  backend:
    build: .  
    container_name: nodevault-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/nodevault
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - nodevault-network

volumes:
  mongodb_data:

networks:
  nodevault-network:
    driver: bridge
